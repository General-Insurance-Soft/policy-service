spring.application.name=policy-service

spring.profiles.active=dev

server.port=8034
server.servlet.context-path=/policy-service

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=create

backblaze.s3.endpoint-url=https://s3.us-east-005.backblazeb2.com
backblaze.s3.bucket-name=gisca-store

spring.cloud.gateway.discovery.locator.enabled=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

logging.level.org.springframework.web=DEBUG
logging.level.root=ERROR
logging.level.org.hibernate= DEBUG
logging.level.app.g_agent.policy_service=DEBUG
# make logging.pattern.console  show file and line number in log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}:%line - %msg%n





#hibernate to use UTC
spring.jpa.hibernate.jdbc.time_zone=UTC


